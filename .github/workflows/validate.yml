name: Validate pull requests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Harness validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # The source header check compares against the Harness adoption commit.
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium for project tests
        run: npx playwright install --with-deps chromium
      - name: Validate project profile
        run: node .harness/scripts/validate-config.mjs
      - name: Run project checks
        env:
          BASE_PATH: '/${{ github.event.repository.name }}'
        run: node .harness/scripts/validate.mjs --execute

  browser:
    name: Browser asset flow
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser asset checks
        run: npm run test:browser
